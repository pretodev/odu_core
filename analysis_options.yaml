include: package:odu_core_lint/analysis_options.yaml

plugins:
  odu_props_assist:
    path: tools/odu_core_lint/plugin

analyzer:
  exclude:
    - build/**
    - tools/**
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "**/*.gen.dart"
    - "**/*.gr.dart"
    - "**/*.mocks.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
